name: rm_boutique
description: R&M Boutique - one app, three roles (admin, customer, rider), Supabase backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  provider: ^6.1.2
  go_router: ^14.6.0
  image_picker: ^1.1.2
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
